[develop]
script_dir=$base/lib/seg2grasp_ros
[install]
install_scripts=$base/lib/seg2grasp_ros
# Run the node with whichever python3 is first on PATH, so `ros2 run` picks up
# the activated Seg2Grasp venv (torch, detectron2, seg2grasp) instead of /usr/bin/python3.
[build_scripts]
executable=/usr/bin/env python3
